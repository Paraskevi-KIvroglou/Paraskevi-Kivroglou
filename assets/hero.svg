      <circle cy="-150" r="5" fill="#e3c576"/><circle cx="-130" cy="75" r="5" fill="#e3c576"/><circle cx="130" cy="75" r="5" fill="#e3c576"/>
      <g font-size="11" letter-spacing="2" fill="#c6c1ce" text-anchor="middle">
