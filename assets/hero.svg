<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Paraskevi Kivroglou. I build AI systems that do the work.</title>
  <desc id="desc">Gold and cream typography on midnight blue, with an orbital diagram connecting agents, automation and search visibility. AI engineer and founder of AureliaEdge.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#c9a24b" stop-opacity=".16"/><stop offset="1" stop-color="#03060f" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0a6"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#827126"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="#03060f"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <ellipse cx="1040" cy="190" rx="420" ry="320" fill="url(#glow)"/>
  <path d="M48 1H1232" stroke="url(#gold)" stroke-opacity=".7"/>
