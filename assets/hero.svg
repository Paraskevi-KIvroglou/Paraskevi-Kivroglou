      <text x="60" y="160" fill="#f6f2e9">I build AI systems</text>
      <text x="60" y="228" fill="#e3c576" font-style="italic">that do the work.</text>
    </g>
    <text x="64" y="278" fill="#bbb8c7" font-size="18">Agents, automation and AI search visibility for growing businesses.</text>
    <path d="M64 312H690" stroke="#c9a24b" stroke-opacity=".22"/>
    <g font-size="14">
      <text x="64" y="352" fill="#c9a24b">Founder <tspan fill="#edeaf2" dx="7">AureliaEdge</tspan></text>
      <text x="262" y="352" fill="#c9a24b">Partner <tspan fill="#edeaf2" dx="7">OpenAI Select Partner</tspan></text>
      <text x="538" y="352" fill="#c9a24b">Research <tspan fill="#edeaf2" dx="7">IEEE, RAG for code generation</tspan></text>
    </g>
    <g transform="translate(1010 210)">
      <circle r="150" fill="none" stroke="#c9a24b" stroke-opacity=".13"/>
      <circle r="112" fill="none" stroke="#c9a24b" stroke-opacity=".22"/>
      <circle r="76" fill="none" stroke="url(#gold)" stroke-opacity=".6"/>
      <path d="M0-150V-76M-130 75L-66 38M130 75L66 38" stroke="#c9a24b" stroke-opacity=".6"/>
